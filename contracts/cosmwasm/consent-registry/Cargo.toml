[package]
name = "consent-registry"
version = "0.1.0"
edition = "2021"
description = "Healthcare consent registry and access log for LastcoinVision"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# For quicker tests, cargo test --lib is 1 test faster if we skip the schema entry point,
# which itself does not have any tests. So use "library" feature to short-circuit contract.rs
# entry points when compiling this as a library, matching the standard cw-template convention.
library = []

[profile.release]
opt-level = "z"
lto = true
overflow-checks = true
panic = "abort"
codegen-units = 1
strip = true

[dependencies]
cosmwasm-schema = "2.1"
cosmwasm-std = "2.1"
cw-storage-plus = "2.0"
cw2 = "2.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cw-multi-test = "2.1"
