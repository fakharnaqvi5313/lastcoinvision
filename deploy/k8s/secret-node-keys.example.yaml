# TEMPLATE — do not apply as-is. All key material below is a placeholder.
#
# Node identity (node_key.json) must stay stable across pod restarts for
# persistent_peers to keep working, and the validator's consensus key
# (priv_validator_key.json) must never be generated by cluster tooling or
# committed to git (see docs/docs/validator-handbook.md's key-management
# section). Generate the real files offline instead:
#
#   lcvd init validator-0 --chain-id lcv-testnet --home /tmp/validator-0
#   lcvd init sentry-0     --chain-id lcv-testnet --home /tmp/sentry-0
#   lcvd init sentry-1     --chain-id lcv-testnet --home /tmp/sentry-1
#   lcvd init sentry-2     --chain-id lcv-testnet --home /tmp/sentry-2
#
# Then create the real secrets directly from those files (never hand-edit
# JSON into a committed manifest):
#
#   kubectl create secret generic lcv-validator-key -n lcv-testnet \
#     --from-file=node_key.json=/tmp/validator-0/config/node_key.json \
#     --from-file=priv_validator_key.json=/tmp/validator-0/config/priv_validator_key.json
#
#   kubectl create secret generic lcv-sentry-node-keys -n lcv-testnet \
#     --from-file=node_key-0.json=/tmp/sentry-0/config/node_key.json \
#     --from-file=node_key-1.json=/tmp/sentry-1/config/node_key.json \
#     --from-file=node_key-2.json=/tmp/sentry-2/config/node_key.json
#
# `lcvd comet show-node-id --home /tmp/<dir>` on each prints the ID to put
# into configmap-node-ids.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: lcv-validator-key
  namespace: lcv-testnet
type: Opaque
stringData:
  node_key.json: "REPLACE ME — see comment above, never commit a real key"
  priv_validator_key.json: "REPLACE ME — see comment above, never commit a real key"
---
apiVersion: v1
kind: Secret
metadata:
  name: lcv-sentry-node-keys
  namespace: lcv-testnet
type: Opaque
stringData:
  node_key-0.json: "REPLACE ME"
  node_key-1.json: "REPLACE ME"
  node_key-2.json: "REPLACE ME"
