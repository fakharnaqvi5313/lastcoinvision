server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ping.pub is a client-side-routed SPA (Vue Router) — unknown paths like
    # /lcv-devnet must fall back to index.html instead of nginx's own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
