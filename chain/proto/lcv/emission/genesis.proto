syntax = "proto3";
package lcv.emission;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "lcv/emission/params.proto";

option go_package = "github.com/lastcoinvision/lcv/x/emission/types";

// GenesisState defines the emission module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // last_emission_time is the unix time (seconds) up to which staking
  // rewards have already been emitted. Zero means a fresh genesis with no
  // prior emission history, in which case InitGenesis anchors it to
  // params.start_time instead. Exported so a chain export/import (upgrade,
  // state-sync) doesn't rewind the decay curve's bookkeeping back to the
  // original genesis start time.
  int64 last_emission_time = 2;
}
