syntax = "proto3";
package lcv.taxrail;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/lastcoinvision/lcv/x/taxrail/types";

message EventTaxRuleRegistered {
  string jurisdiction_code = 1;
  string rate = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

message EventTaxedTransfer {
  string sender = 1;
  string recipient = 2;
  string jurisdiction_code = 3;
  cosmos.base.v1beta1.Coin tax_amount = 4 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin remainder_amount = 5 [(gogoproto.nullable) = false];
}

message EventCollectedTaxSpent {
  string jurisdiction_code = 1;
  string recipient = 2;
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
  string reason = 4;
}
