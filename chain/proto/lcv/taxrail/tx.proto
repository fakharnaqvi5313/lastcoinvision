syntax = "proto3";
package lcv.taxrail;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "lcv/taxrail/params.proto";

option go_package = "github.com/lastcoinvision/lcv/x/taxrail/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // RegisterTaxRule sets (or replaces) the tax rate for a jurisdiction
  // code. Authority-gated (governance).
  rpc RegisterTaxRule(MsgRegisterTaxRule) returns (MsgRegisterTaxRuleResponse);

  // TaxedTransfer atomically splits amount between the jurisdiction's
  // collector treasury (per its registered rate) and the recipient, per
  // the top-level spec's split-payment primitive.
  rpc TaxedTransfer(MsgTaxedTransfer) returns (MsgTaxedTransferResponse);

  // SpendCollectedTax moves funds out of a jurisdiction's collected-tax
  // balance to a recipient. Authority-gated (governance) — the top-level
  // spec requires collector outflows to require a governance proposal.
  rpc SpendCollectedTax(MsgSpendCollectedTax) returns (MsgSpendCollectedTaxResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "lcv/x/taxrail/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgRegisterTaxRule {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "lcv/x/taxrail/MsgRegisterTaxRule";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string jurisdiction_code = 2;
  string rate = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}

message MsgRegisterTaxRuleResponse {}

message MsgTaxedTransfer {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "lcv/x/taxrail/MsgTaxedTransfer";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string recipient = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string jurisdiction_code = 3;
  cosmos.base.v1beta1.Coin amount = 4 [(gogoproto.nullable) = false];
}

message MsgTaxedTransferResponse {
  cosmos.base.v1beta1.Coin tax_amount = 1 [(gogoproto.nullable) = false];
  cosmos.base.v1beta1.Coin remainder_amount = 2 [(gogoproto.nullable) = false];
}

message MsgSpendCollectedTax {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "lcv/x/taxrail/MsgSpendCollectedTax";

  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string jurisdiction_code = 2;
  string recipient = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin amount = 4 [(gogoproto.nullable) = false];
  string reason = 5;
}

message MsgSpendCollectedTaxResponse {}