syntax = "proto3";
package lcv.identity;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/lastcoinvision/lcv/x/identity/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "lcv/x/identity/Params";
  option (gogoproto.equal) = true;

  // attested_credential_type is the Credential.credential_type value that,
  // when held active and unrevoked from an authorized issuer, grants an
  // address the "attested" account tier (see identity.proto's AccountTier).
  string attested_credential_type = 1;
}