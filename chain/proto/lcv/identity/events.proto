syntax = "proto3";
package lcv.identity;

option go_package = "github.com/lastcoinvision/lcv/x/identity/types";

message EventDIDCreated {
  string id = 1;
  string controller = 2;
}

message EventDIDUpdated {
  string id = 1;
}

message EventDIDDeactivated {
  string id = 1;
}

message EventIssuerAdded {
  string address = 1;
  string name = 2;
}

message EventIssuerRemoved {
  string address = 1;
}

message EventCredentialIssued {
  string id = 1;
  string subject = 2;
  string issuer = 3;
  string credential_type = 4;
}

message EventCredentialRevoked {
  string id = 1;
  string issuer = 2;
}

message EventCredentialPresented {
  string id = 1;
  string presenter = 2;
  bool valid = 3;
}
