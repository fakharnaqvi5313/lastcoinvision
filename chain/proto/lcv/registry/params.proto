syntax = "proto3";
package lcv.registry;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/lastcoinvision/lcv/x/registry/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "lcv/x/registry/Params";
  option (gogoproto.equal) = true;

  
}