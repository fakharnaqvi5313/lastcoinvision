,"type":"string"}}},"lcv.identity.CredentialStatus":{"description":"CredentialStatus is the on-chain lifecycle state of an anchored\ncredential. There is deliberately no \"expired\" state: expiry is a\nproperty of the off-chain credential document itself, not tracked here.","type":"string","default":"CREDENTIAL_STATUS_UNSPECIFIED","enum":["CREDENTIAL_STATUS_UNSPECIFIED","CREDENTIAL_STATUS_ACTIVE","CREDENTIAL_STATUS_REVOKED"]},"lcv.identity.DIDDocument":{"description":"DIDDocument is the on-chain representation of a did:lcv DID document. It\ndeliberately holds no personal data: verification methods and service\nendpoints are the only content, matching W3C DID Core's minimal\nrequirements.","type":"object","properties":{"controller":{"description":"controller is the bech32 address controlling this DID (normally the\nsubject itself).","type":"string"},"created_at":{"type":"string","format":"int64"},"deactivated":{"type":"boolean"},"id":{"description":"id is \"did:lcv:\u003cbech32 address\u003e\".","type":"string"},"service":{"type":"array","items":{"type":"object","$ref":"#/definitions/lcv.identity.ServiceEndpoint"}},"updated_at":{"type":"string","format":"int64"},"verification_method":{"type":"array","items":{"type":"object","$ref":"#/definitions/lcv.identity.VerificationMethod"}}}},"lcv.identity.Issuer":{"description":"Issuer is a governance-authorized credential issuer.","type":"object","properties":{"added_at":{"type":"string","format":"int64"},"address":{"type":"string"},"name":{"type":"string"}}},"lcv.identity.MsgAddIssuer":{"type":"object","properties":{"authority":{"type":"string"},"issuer_address":{"type":"string"},"name":{"type":"string"}}},"lcv.identity.MsgAddIssuerResponse":{"type":"object"},"lcv.identity.MsgCreateDID":{"type":"object","properties":{"creator":{"type":"string"},"service":{"type":"array","items":{"type":"object","$ref":"#/definitions/lcv.identity.ServiceEndpoint"}},"verification_method":{"type":"array","items":{"type":"object","$ref":"#/defin