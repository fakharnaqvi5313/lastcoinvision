module (defaults to x/gov unless overwritten).","type":"string"},"params":{"description":"params defines the module parameters to update.\n\nNOTE: All parameters must be supplied.","$ref":"#/definitions/lcv.emission.Params"}}},"lcv.emission.MsgUpdateParamsResponse":{"description":"MsgUpdateParamsResponse defines the response structure for executing a\nMsgUpdateParams message.","type":"object"},"lcv.emission.Params":{"description":"Params defines the parameters for the module.","type":"object","properties":{"half_life_seconds":{"description":"half_life_seconds is the exponential decay half-life: the emission rate\nhalves every half_life_seconds of elapsed chain time.","type":"string","format":"int64"},"mint_denom":{"description":"mint_denom is the denom emitted as staking rewards (ulcv).","type":"string"},"staking_rewards_account":{"description":"staking_rewards_account is the name of the module account that holds the\ngenesis-funded staking rewards pool that emissions are transferred from.","type":"string"},"start_time":{"description":"start_time is the unix time (seconds) the decay curve is anchored to,\nset once at genesis and not intended to change afterwards.","type":"string","format":"int64"},"total_reward_pool":{"description":"total_reward_pool is the asymptotic total amount (in mint_denom) that will\nbe emitted over the lifetime of the decay curve as elapsed time goes to\ninfinity. Emissions are transfers out of the pre-funded\nstaking_rewards_account, never new minting, so this must not exceed the\namount that account was funded with at genesis.","type":"string"}}},"lcv.emission.QueryParamsResponse":{"description":"QueryParamsResponse is response type for the Query/Params RPC method.","type":"object","properties":{"params":{"description":"params holds all the parameters of this module.","$ref":"#/definitions/lcv.emission.Params"}}},"lcv.feemarket.MsgUpdateParams":{"description":"MsgUpdateParams is the Msg/UpdateParams request type.","type":"object","properties":{"authority":{"description":"authority is the address that controls the module (defaults to x/gov unless overwritten).","type":"string"},"params":{"description":"params defines the module parameters to update.\n\nNOTE: All parameters must be supplied.","$ref":"#/definitions/lcv.feemarket.Params"}}},"lcv.feemarket.MsgUpdateParamsResponse":{"description":"MsgUpdateParamsResponse defines the response structure for executing a\nMsgUpdateParams message.","type":"object"},"lcv.feemarket.Params":{"description":"Params defines the parameters for the module.","type":"object","properties":{"base_fee":{"description":"base_fee is the current EIP-1559-style base fee, in fee_denom per unit\nof gas. Adjusted every block by EndBlock based on how full the previous\nblock was relative to target_gas.","type":"string"},"burn_percentage":{"description":"burn_percentage is the fraction of the base fee portion of every\ntransaction fee that is burned rather than credited to the fee\ncollector for validator/community-pool distribution.","type":"string"},"fee_denom":{"description":"fee_denom is the denom the dynamic base fee is charged in (ulcv).","type":"string"},"max_base_fee_change_denominator":{"description":"max_base_fee_change_denominator bounds how much base_fee can move in a\nsingle block: at most a 1/max_base_fee_change_denominator fraction of\nthe previous base_fee, in either direction (8 means max 12.5% per block,\nmatching Ethereum's EIP-1559 default).","type":"string","format":"int64"},"min_base_fee":{"description":"min_base_fee is the floor base_fee can never adjust below.","type":"string"},"target_gas":{"description":"target_gas is the per-block gas usage the fee market targets: above it\nbase_fee rises, below it base_fee falls.","type":"string","format":"int64"}}},"lcv.feemarket.QueryParamsResponse":{"description":"QueryParamsResponse is response type for the Query/Params RPC method.","type":"object","properties":{"params":{"description":"params holds all the parameters 